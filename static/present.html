<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apresentar — R10 Webcam</title>
<style>
html,body{margin:0;height:100%;background:#000}
img{width:100vw;height:100vh;object-fit:contain;background:#000;display:block}
.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:20px;font:13px system-ui;opacity:.9}
.hint.hide{opacity:0;transition:opacity 1s}
</style>
</head>
<body>
<img id="p" src="/preview.mjpg" alt="apresentar">
<div class="hint" id="h">Modo Apresentar — use Compartilhar tela/aba no Meet/Zoom (F11 = tela cheia, some em 5s)</div>
<script>
setTimeout(()=>document.getElementById('h').classList.add('hide'),5000);
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen().catch(()=>{});});
</script>
</body>
</html>
